[package]
name = "orsx"
version = "0.0.1"
edition = "2021"
authors = ["TIA Lab"]
description = "Orso evolved - thin, blazing-fast layer over sqlx for PostgreSQL with zero-loss migrations"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tia-lab/orsx"

[dependencies]
sqlx = { workspace = true }
jiff = { workspace = true }
jiff-sqlx = { workspace = true }
pgvector = { workspace = true }
cydec = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }

orsx-macros = { path = "../orsx-macros" }

[dev-dependencies]
criterion = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing-subscriber = "0.3"
uuid = { version = "1.0", features = ["v4"] }
chrono = "0.4"

[[test]]
name = "core_functionality"
path = "../tests/core_functionality.rs"

[[test]]
name = "integration_tests"
path = "../tests/integration_tests.rs"

[[test]]
name = "batch_operations"
path = "../tests/batch_operations.rs"

[[example]]
name = "basic_usage"
path = "../examples/basic_usage.rs"

[[example]]
name = "basic_crud"
path = "../examples/basic_crud.rs"

[[example]]
name = "mathilde_pattern"
path = "../examples/mathilde_pattern.rs"

[[example]]
name = "compression"
path = "../examples/compression.rs"

[[example]]
name = "mathilde_performance_test"
path = "../examples/mathilde_performance_test.rs"

[[example]]
name = "batch_operations_demo"
path = "../examples/batch_operations_demo.rs"

[[bench]]
name = "insert"
harness = false
path = "../benches/insert.rs"

[[bench]]
name = "select"
harness = false
path = "../benches/select.rs"

[[bench]]
name = "compressed"
harness = false
path = "../benches/compressed.rs"

[[bench]]
name = "batch_benchmarks"
harness = false
path = "../benches/batch_benchmarks.rs"
